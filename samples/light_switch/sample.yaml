sample:
  description: Combined Matter + Zigbee dimmable light switch sample
  name: Matter + Zigbee Light switch
common:
  tags:
    - ci_build
    - smoke
    - sysbuild
    - ci_samples_matter_zigbee
tests:
  sample.matter_zigbee.light_switch:
    sysbuild: true
    build_only: true
    extra_args:
      - SNIPPET=ext_flash
    integration_platforms:
      - nrf54l15dk/nrf54l15/cpuapp
      - nrf54lm20dk/nrf54lm20b/cpuapp
    platform_allow:
      - nrf54l15dk/nrf54l15/cpuapp
      - nrf54lm20dk/nrf54lm20a/cpuapp
      - nrf54lm20dk/nrf54lm20b/cpuapp
  sample.matter_zigbee.light_switch.int_flash:
    sysbuild: true
    build_only: true
    integration_platforms:
      - nrf54lm20dk/nrf54lm20b/cpuapp
    platform_allow:
      - nrf54lm20dk/nrf54lm20a/cpuapp
      - nrf54lm20dk/nrf54lm20b/cpuapp
  sample.matter_zigbee.light_switch.release:
    sysbuild: true
    build_only: true
    extra_args:
      - SNIPPET=ext_flash
      - EXTRA_CONF_FILE=release.conf
    platform_allow:
      - nrf54l15dk/nrf54l15/cpuapp
      - nrf54lm20dk/nrf54lm20a/cpuapp
      - nrf54lm20dk/nrf54lm20b/cpuapp
    tags:
      - no_integration
  sample.matter_zigbee.light_switch.touchlink:
    sysbuild: true
    build_only: true
    extra_args:
      - SNIPPET=ext_flash
      - CONFIG_ZIGBEE_TOUCHLINK_INITIATOR=y
    platform_allow:
      - nrf54l15dk/nrf54l15/cpuapp
      - nrf54lm20dk/nrf54lm20a/cpuapp
      - nrf54lm20dk/nrf54lm20b/cpuapp
    tags:
      - no_integration
  sample.matter_zigbee.light_switch.zigbee_fota:
    sysbuild: true
    build_only: true
    extra_args:
      - SNIPPET=ext_flash
      - EXTRA_CONF_FILE=zigbee_fota.conf
    platform_allow:
      - nrf54l15dk/nrf54l15/cpuapp
      - nrf54lm20dk/nrf54lm20a/cpuapp
      - nrf54lm20dk/nrf54lm20b/cpuapp
    tags:
      - no_integration
  sample.matter_zigbee.light_switch.touchlink.power_consumption_testing:
    sysbuild: true
    build_only: true
    extra_args:
      - SNIPPET=ext_flash
      - CONFIG_ZIGBEE_TOUCHLINK_INITIATOR=y
      - EXTRA_CONF_FILE=release.conf
      - CONFIG_MATTER_ZIGBEE_UI_DISABLE_LEDS=y
    platform_allow:
      - nrf54l15dk/nrf54l15/cpuapp
      - nrf54lm20dk/nrf54lm20a/cpuapp
      - nrf54lm20dk/nrf54lm20b/cpuapp
    tags:
      - no_integration
