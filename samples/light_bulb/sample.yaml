sample:
  description: Combined Matter + Zigbee dimmable light bulb sample
  name: Matter + Zigbee Light bulb
common:
  tags:
    - ci_build
    - smoke
    - sysbuild
    - ci_samples_matter_zigbee
tests:
  sample.matter_zigbee.light_bulb:
    sysbuild: true
    build_only: true
    extra_args:
      - SNIPPET=matter_fota_ext_flash
    integration_platforms:
      - nrf54l15dk/nrf54l15/cpuapp
      - nrf54lm20dk/nrf54lm20b/cpuapp
    platform_allow:
      - nrf54l15dk/nrf54l15/cpuapp
      - nrf54lm20dk/nrf54lm20a/cpuapp
      - nrf54lm20dk/nrf54lm20b/cpuapp
  sample.matter_zigbee.light_bulb.int_flash:
    sysbuild: true
    build_only: true
    integration_platforms:
      - nrf54lm20dk/nrf54lm20b/cpuapp
    platform_allow:
      - nrf54lm20dk/nrf54lm20a/cpuapp
      - nrf54lm20dk/nrf54lm20b/cpuapp
  sample.matter_zigbee.light_bulb.release:
    sysbuild: true
    build_only: true
    extra_args:
      - SNIPPET=matter_fota_ext_flash
      - EXTRA_CONF_FILE=matter_fota_release.conf
    platform_allow:
      - nrf54l15dk/nrf54l15/cpuapp
      - nrf54lm20dk/nrf54lm20a/cpuapp
      - nrf54lm20dk/nrf54lm20b/cpuapp
    tags:
      - no_integration
  sample.matter_zigbee.light_bulb.touchlink:
    sysbuild: true
    build_only: true
    extra_args:
      - SNIPPET=matter_fota_ext_flash
      - CONFIG_ZIGBEE_TOUCHLINK_TARGET=y
    platform_allow:
      - nrf54l15dk/nrf54l15/cpuapp
      - nrf54lm20dk/nrf54lm20a/cpuapp
      - nrf54lm20dk/nrf54lm20b/cpuapp
    tags:
      - no_integration
  sample.matter_zigbee.light_bulb.zigbee_fota:
    sysbuild: true
    build_only: true
    extra_args:
      - SNIPPET=matter_fota_ext_flash
      - EXTRA_CONF_FILE=zigbee_fota.conf
    platform_allow:
      - nrf54l15dk/nrf54l15/cpuapp
      - nrf54lm20dk/nrf54lm20a/cpuapp
      - nrf54lm20dk/nrf54lm20b/cpuapp
    tags:
      - no_integration